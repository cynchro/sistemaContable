# Ejecutar desde la raíz del proyecto: docker compose up --build
#
# Creá `.env` desde `.env.example` y usá DB_HOST=moduxdb para el servicio MySQL de abajo.

services:
  modux-backend:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    container_name: moduxbackend
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html
    environment:
      DB_HOST: moduxdb
      DB_PORT: '3306'
      DB_NAME: modux
      DB_USER: modux
      DB_PASS: modux
    networks:
      - app-network
    depends_on:
      - moduxdb

  # SPA (React + CoreUI) servida como estáticos por nginx. Se sirve en localhost:5173
  # (origen permitido por el CORS del backend). La app consume la API en localhost:8080
  # (VITE_API_URL por defecto). Para desarrollo con hot-reload usar `npm run dev` en frontend/.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: moduxfrontend
    ports:
      - "5173:80"
    networks:
      - app-network
    depends_on:
      - modux-backend

  moduxdb:
    image: mysql:8.0
    container_name: moduxdb
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: modux
      MYSQL_USER: modux
      MYSQL_PASSWORD: modux
    ports:
      - "3308:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db_data:
