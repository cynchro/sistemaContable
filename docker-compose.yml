# Ejecutar desde la raíz del proyecto: docker compose up --build
#
# Creá `.env` desde `.env.example` y usá DB_HOST=moduxdb para el servicio MySQL de abajo.

services:
  modux-backend:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    container_name: moduxbackend
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html
    environment:
      DB_HOST: moduxdb
      DB_PORT: '3306'
      DB_NAME: modux
      DB_USER: modux
      DB_PASS: modux
    networks:
      - app-network
    depends_on:
      - moduxdb

  # SPA (React + CoreUI) en MODO DESARROLLO: Vite dev server con hot-reload (HMR).
  # El código se monta por bind-mount, así los cambios se ven al instante SIN buildear.
  # Se sirve en http://localhost:5173 y consume la API en localhost:8080 (VITE_API_URL).
  # Para producción usar docker-compose.prod.yml (build estático servido por nginx).
  frontend:
    image: node:20-alpine
    container_name: moduxfrontend
    working_dir: /app
    # Instala dependencias (rápido si ya están) y levanta Vite accesible desde el host.
    command: sh -c "npm install && npm run dev"
    environment:
      VITE_API_URL: http://localhost:8080
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    networks:
      - app-network
    depends_on:
      - modux-backend

  moduxdb:
    image: mysql:8.0
    container_name: moduxdb
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: modux
      MYSQL_USER: modux
      MYSQL_PASSWORD: modux
    ports:
      - "3308:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db_data:
  frontend_node_modules:
