services:
  extractor:
    build: .
    env_file:
      - .env
    volumes:
      # Sesión de Playwright persistida (storageState) — se genera con
      # "npm run login" corrido FUERA de Docker (ver README), y el
      # contenedor solo la reutiliza en modo headless.
      - ./.sessions:/app/.sessions
      # Salida de los xlsx generados, visible en el host.
      - ./salida:/app/salida
      # Capturas de pantalla si algo falla en modo headless (ver cli/traer.ts).
      - ./debug:/app/debug
    # Sin comando fijo: siempre se invoca explícito, ej.
    #   docker compose run --rm extractor npm run traer -- --periodo 07/2026

  # Botón "Liquidar IVA" (plan 25/08/2026): proceso de larga duración, prendido con
  # `docker compose up -d extractor-worker`, que hace polling a la cola de `ecosistema`
  # (GET /iva/liquidaciones/pendientes) y ejecuta cada pedido — ver src/cli/worker.ts.
  # Reusa la misma imagen y las mismas sesiones guardadas (.sessions) que `extractor`;
  # a diferencia de ese servicio, este SÍ tiene un comando fijo porque es lo único que hace.
  extractor-worker:
    build: .
    env_file:
      - .env
    volumes:
      - ./.sessions:/app/.sessions
      - ./debug:/app/debug
    command: npm run worker
    restart: unless-stopped
